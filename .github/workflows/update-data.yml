
name: Update reading data

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Date"
        required: true
        type: string
      value:
        description: "Valeur"
        required: true
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update data.json
        env:
          DATE: ${{ inputs.date }}
          VALUE: ${{ inputs.value }}
        run: |
          python - <<'PY'
          import json
          import os

          path = "data.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          date = os.environ["DATE"]
          value = os.environ["VALUE"]

          data[date] = value.lower() == "true"

          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
              f.write("\n")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Update reading data"
          git push
