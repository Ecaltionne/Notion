<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 Helvetica, Arial, sans-serif;
    color: #37352f;
  }

  .tracker {
    width: 100%;
    max-width: 420px;
    margin: auto;
    padding: 16px;
    background: transparent;
    border: 1px solid #aaa69d;
    border-radius: 10px;
  }

  /* =========================
     EN-TÊTE
     ========================= */

  .header {
    display: flex;
    align-items: center;
    margin-bottom: 14px;
  }

  .symbol {
    color: #37352f;
    font-size: 17px;
    margin-right: 7px;
    line-height: 1;
  }

  .title {
    flex: 1;

    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco,
                 Consolas, "Liberation Mono", "Courier New", monospace;

    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.2px;
  }

  /* =========================
     BOUTON CONFIGURATION
     ========================= */

  .settings {
    width: 24px;
    height: 24px;

    padding: 0;

    border: none;
    background: transparent;

    color: #E3E2E0;

    font-size: 15px;

    cursor: pointer;

    border-radius: 10px;
  }

  .settings:hover {
    background: #eeeae2;
    color: #37352f;
  }

  /* =========================
     CONFIGURATION TOKEN
     ========================= */

  .config {
    display: none;

    margin-bottom: 14px;
    padding: 10px;

    border: 1px solid #aaa69d;
    border-radius: 7px;

    background: rgba(255,255,255,0.25);
  }

  .config.visible {
    display: block;
  }

  .config-title {
    margin-bottom: 7px;

    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco,
                 Consolas, "Liberation Mono", "Courier New", monospace;

    font-size: 10px;
    font-weight: 600;
  }

  .token-input {
    width: 100%;

    padding: 7px 8px;

    border: 1px solid #aaa69d;
    border-radius: 5px;

    background: transparent;
    color: #37352f;

    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco,
                 Consolas, "Liberation Mono", "Courier New", monospace;

    font-size: 10px;

    outline: none;
  }

  .token-input:focus {
    border-color: #DFAB00;
  }

  .config-buttons {
    display: flex;
    gap: 6px;

    margin-top: 7px;
  }

  .config-button {
    flex: 1;

    padding: 6px;

    border: none;
    border-radius: 5px;

    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco,
                 Consolas, "Liberation Mono", "Courier New", monospace;

    font-size: 9px;
    font-weight: 600;

    cursor: pointer;
  }

  .save-token {
    background: #DFAB00;
    color: white;
  }

  .save-token:hover {
    background: #C29343;
  }

  .remove-token {
    background: #eeeae2;
    color: #37352f;
  }

  /* =========================
     GRILLE
     ========================= */

  .days {
    display: grid;

    grid-template-columns: repeat(7, 1fr);

    column-gap: 7px;
    row-gap: 5px;

    align-items: center;
  }

  .day-label {
    text-align: center;

    font-size: 9px;
    color: #aaa69d;
    font-weight: 600;
  }

  /* =========================
     CARRÉS
     ========================= */

  .square {
    width: 11px;
    height: 11px;

    margin: auto;

    font-size: 12px;
    line-height: 11px;

    text-align: center;

    color: #aaa69d;

    background: transparent;

    cursor: pointer;

    transition:
      color 0.12s ease,
      transform 0.12s ease;
  }

  .square.done {
    color: #DFAB00;
  }

  .square:hover {
    transform: scale(1.2);
  }

  .square.today {
    outline: 1px solid #DFAB00;
    outline-offset: 2px;
  }

  /* =========================
     BOUTON FAIT
     ========================= */

  .button {
    width: 100%;

    margin-top: 16px;

    padding: 8px 12px;

    border: none;
    border-radius: 6px;

    background: #DFAB00;
    color: #ffffff;

    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco,
                 Consolas, "Liberation Mono", "Courier New", monospace;

    font-size: 12px;
    font-weight: 600;

    letter-spacing: 0.2px;

    cursor: pointer;
  }

  .button:hover {
    background: #C29343;
  }

  /* =========================
     STATUT
     ========================= */

  .status {
    min-height: 14px;

    margin-top: 7px;

    text-align: center;

    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco,
                 Consolas, "Liberation Mono", "Courier New", monospace;

    font-size: 9px;

    color: #aaa69d;
  }

</style>
</head>


<body>

<div class="tracker">


  <!-- =========================
       EN-TÊTE
       ========================= -->

  <div class="header">

    <div class="symbol">
      ༄
    </div>

    <div class="title">
      JOURNAL DE LECTURE
    </div>

    <button
      class="settings"
      id="settings"
      title="Configuration">
      ⚙
    </button>

  </div>


  <!-- =========================
       CONFIGURATION TOKEN
       ========================= -->

  <div
    class="config"
    id="config">

    <div class="config-title">
      TOKEN GITHUB
    </div>

    <input
      class="token-input"
      id="tokenInput"
      type="password"
      autocomplete="off"
      placeholder="Colle ton token GitHub ici">

    <div class="config-buttons">

      <button
        class="config-button save-token"
        id="saveToken">
        ENREGISTRER
      </button>

      <button
        class="config-button remove-token"
        id="removeToken">
        SUPPRIMER
      </button>

    </div>

  </div>


  <!-- =========================
       GRILLE
       ========================= -->

  <div
    class="days"
    id="grid">
  </div>


  <!-- =========================
       BOUTON
       ========================= -->

  <button
    class="button"
    id="validate">

    ✓ FAIT

  </button>


  <!-- =========================
       STATUT
       ========================= -->

  <div
    class="status"
    id="status">
  </div>

</div>


<script>

/* =========================
   CONFIGURATION GITHUB
   ========================= */

const GITHUB_OWNER =
  "Ecaltionne";

const GITHUB_REPO =
  "Notion";

const GITHUB_WORKFLOW =
  "update-data.yml";

const GITHUB_BRANCH =
  "main";

const DATA_URL =
  "./data.json";

const TOKEN_KEY =
  "notion-reading-github-token";


/* =========================
   JOURS
   ========================= */

const DAYS = [
  "L",
  "M",
  "M",
  "J",
  "V",
  "S",
  "D"
];


let data = {};


/* =========================
   STATUT
   ========================= */

function setStatus(message) {

  document
    .getElementById("status")
    .textContent =
      message;
}


/* =========================
   TOKEN
   ========================= */

function getToken() {

  return localStorage.getItem(
    TOKEN_KEY
  );
}


/* =========================
   DATES
   ========================= */

function dateKey(date) {

  const y =
    date.getFullYear();

  const m =
    String(
      date.getMonth() + 1
    ).padStart(2, "0");

  const d =
    String(
      date.getDate()
    ).padStart(2, "0");

  return `${y}-${m}-${d}`;
}


function mondayOfWeek(date) {

  const d =
    new Date(date);

  const day =
    d.getDay();

  const diff =
    day === 0
      ? -6
      : 1 - day;

  d.setDate(
    d.getDate() + diff
  );

  d.setHours(
    0,
    0,
    0,
    0
  );

  return d;
}


function addDays(
  date,
  amount
) {

  const d =
    new Date(date);

  d.setDate(
    d.getDate() + amount
  );

  return d;
}


/* =========================
   AFFICHAGE
   ========================= */

function render() {

  const grid =
    document.getElementById(
      "grid"
    );

  if (!grid) {
    return;
  }

  grid.innerHTML = "";


  /*
    Jours
  */

  DAYS.forEach(
    day => {

      const label =
        document.createElement(
          "div"
        );

      label.className =
        "day-label";

      label.textContent =
        day;

      grid.appendChild(
        label
      );

    }
  );


  const today =
    new Date();

  const todayKey =
    dateKey(today);

  const currentMonday =
    mondayOfWeek(today);


  /*
    10 dernières semaines
  */

  for (
    let week = 9;
    week >= 0;
    week--
  ) {

    const monday =
      addDays(
        currentMonday,
        -week * 7
      );


    for (
      let day = 0;
      day < 7;
      day++
    ) {

      const date =
        addDays(
          monday,
          day
        );

      const key =
        dateKey(date);


      const square =
        document.createElement(
          "div"
        );

      square.className =
        "square";

      square.textContent =
        "■";


      if (data[key]) {

        square.classList.add(
          "done"
        );

      }


      if (
        key === todayKey
      ) {

        square.classList.add(
          "today"
        );

      }


      square.addEventListener(
        "click",
        () => {

          toggleDay(key);

        }
      );


      grid.appendChild(
        square
      );

    }

  }


  updateButton();
}


/* =========================
   CHARGEMENT DATA.JSON
   ========================= */

async function loadData() {

  try {

    const response =
      await fetch(
        DATA_URL +
        "?v=" +
        Date.now(),
        {
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const remoteData =
      await response.json();


    data =
      remoteData || {};


    render();


    setStatus("");

  } catch (error) {

    console.error(
      "Erreur data.json :",
      error
    );


    /*
      La grille reste visible
      même si GitHub est indisponible.
    */

    render();


    setStatus(
      "Données GitHub indisponibles"
    );

  }
}


/* =========================
   SYNCHRONISATION GITHUB
   ========================= */

async function updateGitHub(
  date,
  value
) {

  const token =
    getToken();


  if (!token) {

    setStatus(
      "Token GitHub manquant"
    );

    /*
      Ouvre automatiquement
      la configuration.
    */

    document
      .getElementById(
        "config"
      )
      .classList.add(
        "visible"
      );

    return false;
  }


  setStatus(
    "Synchronisation…"
  );


  const url =
    "https://api.github.com/repos/" +
    GITHUB_OWNER +
    "/" +
    GITHUB_REPO +
    "/actions/workflows/" +
    GITHUB_WORKFLOW +
    "/dispatches";


  try {

    const response =
      await fetch(
        url,
        {

          method: "POST",

          headers: {

            "Accept":
              "application/vnd.github+json",

            "Authorization":
              "Bearer " +
              token,

            "X-GitHub-Api-Version":
              "2022-11-28",

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              ref:
                GITHUB_BRANCH,

              inputs: {

                date:
                  date,

                value:
                  String(value)

              }

            })

        }
      );


    /*
      204 = workflow accepté
    */

    if (
  response.status === 204
) {

  setStatus(
    "✓ Synchronisé"
  );

  setTimeout(() => {
    setStatus("");
  }, 3000);

  return true;
}


    /*
      Token incorrect
    */

    if (
      response.status === 401 ||
      response.status === 403
    ) {

      localStorage.removeItem(
        TOKEN_KEY
      );

      setStatus(
        "Token GitHub invalide"
      );

      document
        .getElementById(
          "config"
        )
        .classList.add(
          "visible"
        );

      return false;
    }


    const errorText =
      await response.text();


    console.error(
      "GitHub :",
      response.status,
      errorText
    );


    setStatus(
      "Erreur GitHub (" +
      response.status +
      ")"
    );


    return false;


  } catch (error) {

    console.error(
      error
    );


    setStatus(
      "Erreur de connexion"
    );


    return false;
  }
}


/* =========================
   MODIFICATION D'UN JOUR
   ========================= */

async function toggleDay(key) {

  const oldValue =
    Boolean(
      data[key]
    );

  const newValue =
    !oldValue;


  /*
    Changement visuel
    immédiat.
  */

  data[key] =
    newValue;

  render();


  /*
    Synchronisation
  */

  const success =
    await updateGitHub(
      key,
      newValue
    );


  /*
    Annule si GitHub refuse.
  */

  if (!success) {

    data[key] =
      oldValue;

    render();

  }
}


/* =========================
   BOUTON FAIT
   ========================= */

function updateButton() {

  const button =
    document.getElementById(
      "validate"
    );

  const todayKey =
    dateKey(
      new Date()
    );


  button.textContent =
    "✓ FAIT";


  button.classList.toggle(
    "done",
    Boolean(
      data[todayKey]
    )
  );
}


document
  .getElementById(
    "validate"
  )
  .addEventListener(
    "click",
    async () => {

      const todayKey =
        dateKey(
          new Date()
        );


      /*
        Déjà fait :
        on ne fait rien.
      */

      if (
        data[todayKey]
      ) {

        return;
      }


      data[todayKey] =
        true;


      render();


      const success =
        await updateGitHub(
          todayKey,
          true
        );


      if (!success) {

        delete data[todayKey];

        render();

      }

    }
  );


/* =========================
   CONFIGURATION
   ========================= */

document
  .getElementById(
    "settings"
  )
  .addEventListener(
    "click",
    () => {

      const config =
        document.getElementById(
          "config"
        );

      config.classList.toggle(
        "visible"
      );


      const token =
        getToken();


      if (token) {

        document
          .getElementById(
            "tokenInput"
          )
          .value =
            token;

      }

    }
  );


/* =========================
   ENREGISTRER TOKEN
   ========================= */

document
  .getElementById(
    "saveToken"
  )
  .addEventListener(
    "click",
    () => {

      const input =
        document.getElementById(
          "tokenInput"
        );

      const token =
        input.value.trim();


      if (!token) {

        setStatus(
          "Token vide"
        );

        return;
      }


      localStorage.setItem(
        TOKEN_KEY,
        token
      );


      setStatus(
        "✓ Token enregistré"
      );


      document
        .getElementById(
          "config"
        )
        .classList.remove(
          "visible"
        );

    }
  );


/* =========================
   SUPPRIMER TOKEN
   ========================= */

document
  .getElementById(
    "removeToken"
  )
  .addEventListener(
    "click",
    () => {

      localStorage.removeItem(
        TOKEN_KEY
      );


      document
        .getElementById(
          "tokenInput"
        )
        .value =
          "";


      setStatus(
        "Token supprimé"
      );

    }
  );


/* =========================
   INITIALISATION
   ========================= */

/*
  On dessine d'abord
  les carrés.
*/

render();


/*
  Puis on récupère
  les données GitHub.
*/

loadData();

</script>

</body>
</html>
