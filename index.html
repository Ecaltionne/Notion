<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 Helvetica, Arial, sans-serif;
    color: #37352f;
  }

  .tracker {
    width: 100%;
    max-width: 420px;
    margin: auto;
    padding: 16px;

    background: transparent;
    border: 1px solid #eseidf;
    border-radius: 10px;
  }

  /* =========================
     EN-TÊTE
     ========================= */

  .header {
    display: flex;
    align-items: center;
    margin-bottom: 14px;
  }

  .symbol {
    color: #37352f;
    font-size: 17px;
    margin-right: 7px;
    line-height: 1;
  }

  .title {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco,
                 Consolas, "Liberation Mono", "Courier New", monospace;

    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.2px;
  }


  /* =========================
     GRILLE
     ========================= */

  .days {
    display: grid;

    /* 7 colonnes exactement identiques */
    grid-template-columns: repeat(7, 1fr);

    column-gap: 7px;
    row-gap: 5px;

    align-items: center;
  }

  .day-label {
    text-align: center;

    font-size: 9px;
    color: #aaa69d;
    font-weight: 600;
  }


  /* =========================
     CARRÉS
     ========================= */

  .square {
    width: 11px;
    height: 11px;

    margin: auto;

    font-size: 12px;
    line-height: 11px;

    text-align: center;

    color: #787774;

    background: transparent;

    cursor: pointer;

    transition:
      color 0.12s ease,
      transform 0.12s ease;
  }

  /* Habitude réalisée */

  .square.done {
    color: #DFAB00;
  }

  /* Petit effet au survol */

  .square:hover {
    transform: scale(1.2);
  }

  /* Jour actuel */

  .square.today {
    outline: 1px solid #DFAB00;
    outline-offset: 2px;
  }


  /* =========================
     BOUTON
     ========================= */

  .button {
    width: 100%;

    margin-top: 16px;

    padding: 8px 12px;

    border: none;
    border-radius: 6px;

    background: #DFAB00;
    color: #ffffff;

    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco,
                 Consolas, "Liberation Mono", "Courier New", monospace;

    font-size: 12px;
    font-weight: 600;

    letter-spacing: 0.2px;

    cursor: pointer;

    transition:
      background 0.15s ease,
      color 0.15s ease;
  }

  .button:hover {
    background: #C29343;
  }

  /*
    Le bouton reste jaune même
    après avoir validé aujourd'hui.
  */

  .button.done {
    background: #DFAB00;
    color: #ffffff;
  }

</style>
</head>


<body>

<div class="tracker">

  <!-- =========================
       EN-TÊTE
       ========================= -->

  <div class="header">

    <div class="symbol">༄</div>

    <div class="title">
      JOURNAL DE LECTURE
    </div>

  </div>


  <!-- =========================
       GRILLE
       ========================= -->

  <div
    class="days"
    id="grid">
  </div>


  <!-- =========================
       BOUTON
       ========================= -->

  <button
    class="button"
    id="validate">

    ✓ FAIT

  </button>

</div>


<script>

  /* =========================
     STOCKAGE
     ========================= */

  const STORAGE_KEY =
    "notion-habit-tracker";


  const DAYS = [
    "L",
    "M",
    "M",
    "J",
    "V",
    "S",
    "D"
  ];


  let data =
    JSON.parse(
      localStorage.getItem(
        STORAGE_KEY
      ) || "{}"
    );


  /* =========================
     OUTILS DE DATE
     ========================= */

  function dateKey(date) {

    const y =
      date.getFullYear();

    const m =
      String(
        date.getMonth() + 1
      ).padStart(2, "0");

    const d =
      String(
        date.getDate()
      ).padStart(2, "0");

    return `${y}-${m}-${d}`;
  }


  function mondayOfWeek(date) {

    const d =
      new Date(date);

    const day =
      d.getDay();

    const diff =
      day === 0
        ? -6
        : 1 - day;

    d.setDate(
      d.getDate() + diff
    );

    d.setHours(
      0,
      0,
      0,
      0
    );

    return d;
  }


  function addDays(
    date,
    amount
  ) {

    const d =
      new Date(date);

    d.setDate(
      d.getDate() + amount
    );

    return d;
  }


  /* =========================
     AFFICHAGE
     ========================= */

  function render() {

    const grid =
      document.getElementById(
        "grid"
      );

    grid.innerHTML = "";


    /*
      En-têtes
    */

    DAYS.forEach(day => {

      const label =
        document.createElement(
          "div"
        );

      label.className =
        "day-label";

      label.textContent =
        day;

      grid.appendChild(
        label
      );

    });


    const today =
      new Date();

    const todayKey =
      dateKey(today);

    const currentMonday =
      mondayOfWeek(today);


    /*
      10 dernières semaines
    */

    for (
      let week = 9;
      week >= 0;
      week--
    ) {

      const monday =
        addDays(
          currentMonday,
          -week * 7
        );


      /*
        Les 7 jours
      */

      for (
        let day = 0;
        day < 7;
        day++
      ) {

        const date =
          addDays(
            monday,
            day
          );

        const key =
          dateKey(date);


        /*
          Création du carré
        */

        const square =
          document.createElement(
            "div"
          );

        square.className =
          "square";

        square.textContent =
          "■";


        /*
          État actuel
        */

        if (
          data[key]
        ) {

          square.classList.add(
            "done"
          );

        }


        /*
          Jour actuel
        */

        if (
          key === todayKey
        ) {

          square.classList.add(
            "today"
          );

        }


        /*
          CLIC SUR LE CARRÉ

          Gris → jaune
          Jaune → gris
        */

        square.addEventListener(
          "click",
          () => {

            if (data[key]) {

              /*
                Jaune → gris
              */

              delete data[key];

            } else {

              /*
                Gris → jaune
              */

              data[key] = true;

            }


            /*
              Sauvegarde
            */

            localStorage.setItem(
              STORAGE_KEY,
              JSON.stringify(data)
            );


            /*
              Actualisation
            */

            render();

          }
        );


        grid.appendChild(
          square
        );

      }

    }


    updateButton();

  }


  /* =========================
     BOUTON "✓ FAIT"
     ========================= */

  function updateButton() {

    const button =
      document.getElementById(
        "validate"
      );

    const todayKey =
      dateKey(
        new Date()
      );


    /*
      Le texte reste toujours
      "✓ FAIT".
    */

    button.textContent =
      "✓ FAIT";


    /*
      Le bouton reste jaune.
    */

    button.classList.toggle(
      "done",
      Boolean(
        data[todayKey]
      )
    );

  }


  /* =========================
     VALIDATION AUJOURD'HUI
     ========================= */

  document
    .getElementById(
      "validate"
    )
    .addEventListener(
      "click",
      () => {

        const todayKey =
          dateKey(
            new Date()
          );


        /*
          Le bouton valide
          toujours aujourd'hui.

          Il ne peut pas annuler
          la journée : pour cela,
          on clique directement
          sur le carré.
        */

        data[todayKey] =
          true;


        /*
          Sauvegarde
        */

        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify(data)
        );


        /*
          Actualisation
        */

        render();

      }
    );


  /* =========================
     INITIALISATION
     ========================= */

  render();

</script>

</body>
</html>
