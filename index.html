<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 Helvetica, Arial, sans-serif;
    color: #37352f;
  }

  .tracker {
    width: 100%;
    max-width: 420px;
    margin: auto;
    padding: 14px 16px 16px;
    background: #fffdf7;
    border-radius: 14px;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .title {
    font-size: 15px;
    font-weight: 600;
  }

  .streak {
    font-size: 12px;
    color: #9a7b18;
  }

  .days {
    display: grid;
    grid-template-columns: 72px repeat(7, 1fr);
    gap: 5px;
    align-items: center;
  }

  .day-label {
    text-align: center;
    font-size: 9px;
    color: #aaa69d;
    font-weight: 600;
  }

  .week-label {
    font-size: 9px;
    color: #aaa69d;
    white-space: nowrap;
  }

  .square {
    width: 11px;
    height: 11px;
    border-radius: 3px;
    background: #e8e8e6;
    margin: auto;
    transition: all 0.15s ease;
  }

  .square.done {
    background: #f4c842;
  }

  .square.today {
    outline: 1.5px solid #d3aa20;
    outline-offset: 2px;
  }

  .button {
    width: 100%;
    margin-top: 15px;
    border: 0;
    border-radius: 8px;
    padding: 8px 12px;
    background: #f4c842;
    color: #3b3217;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.15s ease;
  }

  .button:hover {
    background: #e9ba2d;
  }

  .button.done {
    background: #f8edc2;
    color: #9a7b18;
  }
</style>
</head>

<body>

<div class="tracker">

  <div class="header">
    <div class="title">🌼 Mon habitude</div>
    <div class="streak" id="streak"></div>
  </div>

  <div class="days" id="grid"></div>

  <button class="button" id="validate">
    ✓ Valider aujourd'hui
  </button>

</div>

<script>
  const STORAGE_KEY = "notion-habit-tracker";
  const DAYS = ["L", "M", "M", "J", "V", "S", "D"];

  let data = JSON.parse(
    localStorage.getItem(STORAGE_KEY) || "{}"
  );

  function dateKey(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, "0");
    const d = String(date.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
  }

  function mondayOfWeek(date) {
    const d = new Date(date);
    const day = d.getDay();
    const diff = day === 0 ? -6 : 1 - day;
    d.setDate(d.getDate() + diff);
    d.setHours(0, 0, 0, 0);
    return d;
  }

  function addDays(date, amount) {
    const d = new Date(date);
    d.setDate(d.getDate() + amount);
    return d;
  }

  function render() {
    const grid = document.getElementById("grid");
    grid.innerHTML = "";

    DAYS.forEach(day => {
      const label = document.createElement("div");
      label.className = "day-label";
      label.textContent = day;
      grid.appendChild(label);
    });

    const today = new Date();
    const currentMonday = mondayOfWeek(today);

    // 10 semaines, la semaine actuelle étant la dernière
    for (let week = 9; week >= 0; week--) {

      const monday = addDays(currentMonday, -week * 7);

      const weekLabel = document.createElement("div");
      weekLabel.className = "week-label";

      const start = monday.getDate();
      const end = addDays(monday, 6).getDate();

      weekLabel.textContent = `${start}–${end}`;
      grid.appendChild(weekLabel);

      for (let day = 0; day < 7; day++) {

        const date = addDays(monday, day);
        const key = dateKey(date);

        const square = document.createElement("div");
        square.className = "square";

        if (data[key]) {
          square.classList.add("done");
        }

        if (key === dateKey(today)) {
          square.classList.add("today");
        }

        grid.appendChild(square);
      }
    }

    updateButton();
    updateStreak();
  }

  function updateButton() {
    const button = document.getElementById("validate");
    const todayKey = dateKey(new Date());

    if (data[todayKey]) {
      button.textContent = "✓ Habitude validée aujourd'hui";
      button.classList.add("done");
    } else {
      button.textContent = "✓ Valider aujourd'hui";
      button.classList.remove("done");
    }
  }

  function updateStreak() {
    let streak = 0;
    let date = new Date();

    while (data[dateKey(date)]) {
      streak++;
      date = addDays(date, -1);
    }

    const element = document.getElementById("streak");

    if (streak > 0) {
      element.textContent = `🔥 ${streak} jour${streak > 1 ? "s" : ""}`;
    } else {
      element.textContent = "";
    }
  }

  document.getElementById("validate").addEventListener("click", () => {
    const todayKey = dateKey(new Date());

    data[todayKey] = true;

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(data)
    );

    render();
  });

  render();
</script>

</body>
</html>
