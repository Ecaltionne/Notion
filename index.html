<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 Helvetica, Arial, sans-serif;
    color: #37352f;
  }

  .tracker {
    width: 100%;
    max-width: 420px;
    margin: auto;
    padding: 16px;
    background: transparent;
    border: 1px solid #aaa69d;
    border-radius: 10px;
  }

  .header {
    display: flex;
    align-items: center;
    margin-bottom: 14px;
  }

  .symbol {
    color: #37352f;
    font-size: 17px;
    margin-right: 7px;
    line-height: 1;
  }

  .title {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco,
                 Consolas, "Liberation Mono", "Courier New", monospace;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.2px;
  }

  .days {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    column-gap: 7px;
    row-gap: 5px;
    align-items: center;
  }

  .day-label {
    text-align: center;
    font-size: 9px;
    color: #aaa69d;
    font-weight: 600;
  }

  .square {
    width: 11px;
    height: 11px;
    margin: auto;
    font-size: 12px;
    line-height: 11px;
    text-align: center;
    color: #aaa69d;
    background: transparent;
    cursor: pointer;
    transition: color 0.12s ease, transform 0.12s ease;
  }

  .square.done {
    color: #DFAB00;
  }

  .square:hover {
    transform: scale(1.2);
  }

  .square.today {
    outline: 1px solid #DFAB00;
    outline-offset: 2px;
  }

  .button {
    width: 100%;
    margin-top: 16px;
    padding: 8px 12px;
    border: none;
    border-radius: 6px;
    background: #DFAB00;
    color: #ffffff;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco,
                 Consolas, "Liberation Mono", "Courier New", monospace;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.2px;
    cursor: pointer;
  }

  .button:hover {
    background: #C29343;
  }

  .status {
    margin-top: 8px;
    text-align: center;
    font-size: 9px;
    color: #aaa69d;
    min-height: 12px;
  }
</style>
</head>

<body>

<div class="tracker">

  <div class="header">
    <div class="symbol">༄</div>
    <div class="title">JOURNAL DE LECTURE</div>
  </div>

  <div class="days" id="grid"></div>

  <button class="button" id="validate">
    ✓ FAIT
  </button>

  <div class="status" id="status"></div>

</div>

<script>
 
const GITHUB_OWNER = "Ecaltionne";
const GITHUB_REPO = "Notion";
const GITHUB_WORKFLOW = "update-data.yml";
const GITHUB_BRANCH = "main";

const DATA_URL = "./data.json";

const TOKEN_KEY = "notion-reading-github-token";

const DAYS = [
  "L",
  "M",
  "M",
  "J",
  "V",
  "S",
  "D"
];

let data = {};


/* =========================
   TOKEN
   ========================= */

function getToken() {

  let token =
    localStorage.getItem(TOKEN_KEY);

  if (!token) {

    token = prompt(
      "Entre ton token GitHub.\n\n" +
      "Il sera conservé uniquement sur cet appareil."
    );

    if (token) {

      token = token.trim();

      localStorage.setItem(
        TOKEN_KEY,
        token
      );

    }

  }

  return token;
}


/* =========================
   DATE
   ========================= */

function dateKey(date) {

  const y =
    date.getFullYear();

  const m =
    String(
      date.getMonth() + 1
    ).padStart(2, "0");

  const d =
    String(
      date.getDate()
    ).padStart(2, "0");

  return `${y}-${m}-${d}`;
}


function mondayOfWeek(date) {

  const d =
    new Date(date);

  const day =
    d.getDay();

  const diff =
    day === 0
      ? -6
      : 1 - day;

  d.setDate(
    d.getDate() + diff
  );

  d.setHours(
    0,
    0,
    0,
    0
  );

  return d;
}


function addDays(date, amount) {

  const d =
    new Date(date);

  d.setDate(
    d.getDate() + amount
  );

  return d;
}


/* =========================
   GITHUB
   ========================= */

async function loadData() {

  setStatus("Chargement…");

  try {

    const response =
      await fetch(
        DATA_URL + "?t=" + Date.now(),
        {
          cache: "no-store"
        }
      );

    if (!response.ok) {
      throw new Error(
        "Impossible de charger data.json"
      );
    }

    data =
      await response.json();

    render();

    setStatus("");

  } catch (error) {

    console.error(error);

    data = {};

    render();

    setStatus(
      "Erreur de chargement"
    );
  }
}


async function updateGitHub(
  date,
  value
) {

  const token =
    getToken();

  if (!token) {

    setStatus(
      "Token GitHub manquant"
    );

    return false;
  }

  setStatus(
    "Synchronisation…"
  );

  try {

    const url =
      `https://api.github.com/repos/` +
      `${GITHUB_OWNER}/${GITHUB_REPO}` +
      `/actions/workflows/` +
      `${GITHUB_WORKFLOW}/dispatches`;

    const response =
      await fetch(
        url,
        {
          method: "POST",

          headers: {
            "Accept":
              "application/vnd.github+json",

            "Authorization":
              `Bearer ${token}`,

            "X-GitHub-Api-Version":
              "2022-11-28",

            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            ref:
              GITHUB_BRANCH,

            inputs: {

              date:
                date,

              value:
                String(value)

            }

          })
        }
      );

    if (!response.ok) {

      if (
        response.status === 401 ||
        response.status === 403
      ) {

        localStorage.removeItem(
          TOKEN_KEY
        );

        throw new Error(
          "Token GitHub invalide ou permissions insuffisantes."
        );
      }

      throw new Error(
        `GitHub HTTP ${response.status}`
      );
    }

    setStatus(
      "✓ Synchronisé"
    );

    return true;

  } catch (error) {

    console.error(error);

    setStatus(
      "Erreur de synchronisation"
    );

    return false;
  }
}


/* =========================
   AFFICHAGE
   ========================= */

function render() {

  const grid =
    document.getElementById(
      "grid"
    );

  grid.innerHTML = "";

  DAYS.forEach(day => {

    const label =
      document.createElement(
        "div"
      );

    label.className =
      "day-label";

    label.textContent =
      day;

    grid.appendChild(
      label
    );

  });


  const today =
    new Date();

  const todayKey =
    dateKey(today);

  const currentMonday =
    mondayOfWeek(today);


  for (
    let week = 9;
    week >= 0;
    week--
  ) {

    const monday =
      addDays(
        currentMonday,
        -week * 7
      );


    for (
      let day = 0;
      day < 7;
      day++
    ) {

      const date =
        addDays(
          monday,
          day
        );

      const key =
        dateKey(date);

      const square =
        document.createElement(
          "div"
        );

      square.className =
        "square";

      square.textContent =
        "■";


      if (data[key]) {

        square.classList.add(
          "done"
        );

      }


      if (key === todayKey) {

        square.classList.add(
          "today"
        );

      }


      square.addEventListener(
        "click",
        async () => {

          const newValue =
            !Boolean(data[key]);


          /*
            Mise à jour visuelle
            immédiate
          */

          data[key] =
            newValue;

          render();


          /*
            Envoi à GitHub
          */

          const success =
            await updateGitHub(
              key,
              newValue
            );


          if (!success) {

            /*
              On annule la modification
              si GitHub refuse.
            */

            data[key] =
              !newValue;

            render();

          }

        }
      );


      grid.appendChild(
        square
      );

    }

  }


  updateButton();

}


/* =========================
   BOUTON
   ========================= */

function updateButton() {

  const button =
    document.getElementById(
      "validate"
    );

  const todayKey =
    dateKey(
      new Date()
    );

  button.textContent =
    "✓ FAIT";

  button.classList.toggle(
    "done",
    Boolean(
      data[todayKey]
    )
  );
}


document
  .getElementById(
    "validate"
  )
  .addEventListener(
    "click",
    async () => {

      const todayKey =
        dateKey(
          new Date()
        );


      data[todayKey] =
        true;

      render();


      const success =
        await updateGitHub(
          todayKey,
          true
        );


      if (!success) {

        delete data[todayKey];

        render();

      }

    }
  );


/* =========================
   INITIALISATION
   ========================= */

loadData();

</script>

</body>
</html>
